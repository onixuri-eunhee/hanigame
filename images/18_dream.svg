  <!-- small zzzs -->
  <text x="108" y="105" font-size="12" fill="#FFD700" font-family="Arial" font-weight="700" opacity="0.8">Z</text>
  <text x="118" y="94" font-size="9" fill="#FFD700" font-family="Arial" font-weight="700" opacity="0.6">z</text>
