<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>샘플 카드</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(160deg, #1A1A4E, #0D0D1A);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 32px; padding: 32px;
    font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
  }
  .label { color: #aaa; font-size: 13px; letter-spacing: 1px; }

  .card {
    width: 240px;
    background: linear-gradient(160deg, #FFF5E0 0%, #FFECD0 100%);
    border-radius: 28px;
    padding: 0 0 20px;
    box-shadow:
      0 0 0 3px rgba(255,180,60,0.5),
      0 12px 40px rgba(255,120,30,0.35),
      0 2px 8px rgba(0,0,0,0.3);
    overflow: hidden;
    position: relative;
  }

  /* little shine strip at top */
  .card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
  }

  .card svg { width: 100%; display: block; }

  .card-text {
    text-align: center;
    padding: 0 16px;
    margin-top: 4px;
  }
  .sentence {
    font-size: 17px; font-weight: 900; color: #5A2500;
    line-height: 1.3;
    text-shadow: 0 1px 0 rgba(255,255,255,0.6);
  }
  .gesture-row {
    margin-top: 8px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .gesture-emoji { font-size: 26px; }
  .gesture-hint { font-size: 12px; color: #A0522D; font-weight: 700; }
</style>
</head>
<body>

<div class="label">샘플 카드 — "Firefighters are brave"</div>

<div class="card">
  <svg viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg">
    <!-- ── SKY BACKGROUND ── -->
    <rect width="240" height="200" fill="url(#sky)"/>
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FFD580"/>
        <stop offset="100%" stop-color="#FF8C42"/>
      </linearGradient>
      <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#E53935"/>
        <stop offset="100%" stop-color="#B71C1C"/>
      </linearGradient>
      <linearGradient id="helmetGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#EF5350"/>
        <stop offset="100%" stop-color="#B71C1C"/>
      </linearGradient>
    </defs>

    <!-- ── GROUND ── -->
    <ellipse cx="120" cy="198" rx="90" ry="18" fill="rgba(0,0,0,0.12)"/>
    <rect x="0" y="185" width="240" height="15" fill="#D2691E" rx="0"/>
    <rect x="0" y="182" width="240" height="5" fill="#A0522D" rx="0"/>

    <!-- ── BACKGROUND FLAMES ── -->
    <!-- Flame far left -->
    <path d="M 22 182 C 14 162 24 148 18 130 C 22 145 30 138 26 118 C 32 135 38 128 34 148 C 40 138 42 152 38 168 C 44 158 46 170 42 182 Z"
          fill="#FF6D00" opacity="0.75"/>
    <path d="M 26 182 C 20 165 28 153 24 137 C 28 149 34 144 30 126 C 35 142 40 136 36 154 C 41 145 43 157 40 170 Z"
          fill="#FFD600" opacity="0.6"/>

    <!-- Flame far right -->
    <path d="M 210 182 C 202 162 212 148 206 130 C 210 145 218 138 214 118 C 220 135 226 128 222 148 C 228 138 230 152 226 168 C 232 158 234 170 230 182 Z"
          fill="#FF6D00" opacity="0.75"/>
    <path d="M 214 182 C 208 165 216 153 212 137 C 216 149 222 144 218 126 C 223 142 228 136 224 154 C 229 145 231 157 228 170 Z"
          fill="#FFD600" opacity="0.6"/>

    <!-- ── SHADOW UNDER FEET ── -->
    <ellipse cx="120" cy="186" rx="42" ry="7" fill="rgba(0,0,0,0.18)"/>

    <!-- ── BOOTS ── -->
    <rect x="93" y="168" width="18" height="20" rx="6" fill="#212121"/>
    <rect x="129" y="168" width="18" height="20" rx="6" fill="#212121"/>
    <ellipse cx="102" cy="188" rx="12" ry="5" fill="#111"/>
    <ellipse cx="138" cy="188" rx="12" ry="5" fill="#111"/>

    <!-- ── BODY ── -->
    <rect x="84" y="118" width="72" height="58" rx="14" fill="url(#bodyGrad)"/>
    <!-- Pocket left -->
    <rect x="91" y="130" width="18" height="14" rx="4" fill="rgba(0,0,0,0.2)"/>
    <!-- Pocket right -->
    <rect x="131" y="130" width="18" height="14" rx="4" fill="rgba(0,0,0,0.2)"/>
    <!-- Yellow reflective stripe -->
    <rect x="84" y="150" width="72" height="9" rx="4" fill="#FFD600"/>
    <rect x="84" y="159" width="72" height="4" rx="2" fill="#FF8F00"/>

    <!-- ── ARMS ── -->
    <!-- Left arm -->
    <rect x="58" y="118" width="28" height="18" rx="9" fill="url(#bodyGrad)"/>
    <!-- Right arm -->
    <rect x="154" y="118" width="28" height="18" rx="9" fill="url(#bodyGrad)"/>
    <!-- Left hand (fist raised!) -->
    <circle cx="56" cy="108" r="13" fill="#FDBCB4"/>
    <rect x="44" y="102" width="24" height="12" rx="6" fill="#FDBCB4"/>
    <!-- Right hand (fist) -->
    <circle cx="184" cy="108" r="13" fill="#FDBCB4"/>
    <rect x="172" y="102" width="24" height="12" rx="6" fill="#FDBCB4"/>
    <!-- Knuckle lines -->
    <line x1="50" y1="104" x2="50" y2="112" stroke="rgba(180,100,80,0.3)" stroke-width="1.5"/>
    <line x1="56" y1="103" x2="56" y2="112" stroke="rgba(180,100,80,0.3)" stroke-width="1.5"/>
    <line x1="62" y1="104" x2="62" y2="112" stroke="rgba(180,100,80,0.3)" stroke-width="1.5"/>
    <line x1="178" y1="104" x2="178" y2="112" stroke="rgba(180,100,80,0.3)" stroke-width="1.5"/>
    <line x1="184" y1="103" x2="184" y2="112" stroke="rgba(180,100,80,0.3)" stroke-width="1.5"/>
    <line x1="190" y1="104" x2="190" y2="112" stroke="rgba(180,100,80,0.3)" stroke-width="1.5"/>

    <!-- ── NECK ── -->
    <rect x="105" y="105" width="30" height="18" rx="9" fill="#FDBCB4"/>

    <!-- ── HEAD ── -->
    <circle cx="120" cy="80" r="42" fill="#FDBCB4"/>
    <!-- Ear left -->
    <circle cx="79" cy="82" r="10" fill="#FDBCB4"/>
    <circle cx="79" cy="82" r="5" fill="rgba(220,130,110,0.3)"/>
    <!-- Ear right -->
    <circle cx="161" cy="82" r="10" fill="#FDBCB4"/>
    <circle cx="161" cy="82" r="5" fill="rgba(220,130,110,0.3)"/>

    <!-- ── HELMET ── -->
    <!-- Dome -->
    <path d="M 76 80 Q 76 38 120 36 Q 164 38 164 80 Z" fill="url(#helmetGrad)"/>
    <!-- Brim -->
    <rect x="70" y="76" width="100" height="14" rx="7" fill="#C62828"/>
    <!-- Shine on helmet -->
    <path d="M 90 44 Q 108 38 126 42" stroke="rgba(255,255,255,0.35)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Yellow number badge -->
    <circle cx="120" cy="60" r="11" fill="#FFD600"/>
    <text x="120" y="65" text-anchor="middle" font-size="12" font-weight="900" fill="#B71C1C">1</text>

    <!-- ── FACE ── -->
    <!-- Eyebrows (determined/brave) -->
    <path d="M 101 67 Q 108 62 115 65" stroke="#5D2E0C" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 125 65 Q 132 62 139 67" stroke="#5D2E0C" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Eyes (big, bright) -->
    <circle cx="109" cy="78" r="9" fill="white"/>
    <circle cx="131" cy="78" r="9" fill="white"/>
    <circle cx="110" cy="79" r="6" fill="#1A1A1A"/>
    <circle cx="132" cy="79" r="6" fill="#1A1A1A"/>
    <!-- Iris colour -->
    <circle cx="110" cy="79" r="3.5" fill="#4A90D9"/>
    <circle cx="132" cy="79" r="3.5" fill="#4A90D9"/>
    <!-- Pupil -->
    <circle cx="110" cy="79" r="2" fill="#111"/>
    <circle cx="132" cy="79" r="2" fill="#111"/>
    <!-- Eye shine -->
    <circle cx="112" cy="77" r="1.8" fill="white"/>
    <circle cx="134" cy="77" r="1.8" fill="white"/>

    <!-- Nose -->
    <ellipse cx="120" cy="88" rx="4" ry="3" fill="#F08070"/>

    <!-- Big brave smile -->
    <path d="M 104 96 Q 120 110 136 96" stroke="#C1440E" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Teeth -->
    <path d="M 106 97 Q 120 109 134 97 Q 120 104 106 97 Z" fill="white" opacity="0.7"/>

    <!-- Rosy cheeks -->
    <circle cx="96" cy="91" r="9" fill="rgba(255,120,90,0.3)"/>
    <circle cx="144" cy="91" r="9" fill="rgba(255,120,90,0.3)"/>

    <!-- ── SPARKLES / STARS ── -->
    <!-- Star top-right -->
    <polygon points="205,18 208,28 218,28 210,34 213,44 205,38 197,44 200,34 192,28 202,28"
             fill="#FFD600" opacity="0.9"/>
    <!-- Small stars -->
    <polygon points="35,22 36.5,27 42,27 37.5,30 39,35 35,32 31,35 32.5,30 28,27 33.5,27"
             fill="#FFD600" opacity="0.8"/>
    <polygon points="215,75 216,79 220,79 217,81 218,85 215,83 212,85 213,81 210,79 214,79"
             fill="white" opacity="0.7"/>
    <!-- Sparkle top-left -->
    <line x1="40" y1="50" x2="40" y2="60" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="35" y1="55" x2="45" y2="55" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <!-- Sparkle right -->
    <line x1="202" y1="110" x2="202" y2="118" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="198" y1="114" x2="206" y2="114" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </svg>

  <div class="card-text">
    <div class="sentence">Firefighters are brave</div>
    <div class="gesture-row">
      <span class="gesture-emoji">💪</span>
      <span class="gesture-hint">용감하게 포즈!</span>
    </div>
  </div>
</div>

<div style="color:#888; font-size:12px; text-align:center; max-width:260px; line-height:1.6;">
  실제 게임에선 이런 카드 25장이<br>섞인 채 나와서 순서 맞추는 방식
</div>

</body>
</html>
