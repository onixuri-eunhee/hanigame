<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🍄 무대 계단 — 말하기 대회 연습</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --sky: #5CB3FF; --brick: #C8641E; --gold: #FFD54A;
    --ok: #2ECC40; --warn: #FF9500; --ink: #2A2A3A;
  }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
    background: var(--sky); color: var(--ink);
    touch-action: manipulation; -webkit-user-select: none; user-select: none;
  }
  .screen { display: none; position: absolute; inset: 0; }
  .screen.active { display: flex; }

  /* ── START ── */
  #startScreen { flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 22px; padding: 24px;
    background: linear-gradient(180deg,#5CB3FF 0%,#8FD3FF 60%,#B6E3A8 100%); }
  #startScreen h1 { font-size: clamp(28px,6vw,52px); color: #fff; text-shadow: 3px 3px 0 #1E6FB8; }
  #startScreen p { font-size: clamp(15px,3vw,20px); color: #124; background: rgba(255,255,255,.65);
    padding: 10px 18px; border-radius: 16px; }
  .world-btns { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
  .world-btn {
    width: 200px; padding: 18px 14px; border: none; border-radius: 20px; cursor: pointer;
    background: #fff; box-shadow: 0 6px 0 #1E6FB8; font-family: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 6px; transition: transform .08s;
  }
  .world-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1E6FB8; }
  .world-btn .wnum { font-size: 30px; font-weight: bold; color: var(--brick); }
  .world-btn .wname { font-size: 19px; font-weight: bold; }
  .world-btn .wdesc { font-size: 13px; color: #555; }
  .home-link { position: absolute; top: 14px; left: 14px; text-decoration: none;
    background: rgba(255,255,255,.8); color: #124; padding: 8px 14px; border-radius: 14px;
    font-size: 15px; font-weight: bold; }

  /* ── GAME ── */
  #gameScreen { flex-direction: column; }
  #hud { display: flex; align-items: center; gap: 14px; padding: 8px 14px;
    background: rgba(0,0,0,.22); color: #fff; font-size: clamp(14px,3vw,18px); font-weight: bold; z-index: 5; }
  #hud .world-tag { background: var(--gold); color: #333; padding: 3px 12px; border-radius: 12px; }
  #hud .spacer { flex: 1; }
  #hud .back { text-decoration:none; color:#fff; background:rgba(0,0,0,.3); padding:4px 12px; border-radius:12px; font-size:15px; }
  #stageWrap { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  #stageCanvas, #stage2d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #stage2d { display: none; }

  #panel { background: #FFF6E0; border-top: 5px solid var(--brick);
    display: flex; gap: 14px; padding: 12px 14px; align-items: stretch; min-height: 150px; }
  #picCard { width: 130px; flex-shrink: 0; border-radius: 14px; overflow: hidden;
    background: #fff; border: 3px solid var(--brick); display: flex; align-items: center; justify-content: center; }
  #picCard img { width: 100%; height: 100%; object-fit: cover; }
  #centerCol { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  #sentenceBox { flex: 1; background: #fff; border-radius: 14px; border: 3px solid #E0C88A;
    padding: 12px 16px; font-size: clamp(20px,4.2vw,30px); font-weight: bold; line-height: 1.35;
    display: flex; align-items: center; justify-content: center; text-align: center; min-height: 60px; }
  #sentenceBox .dim { color: #C9B98A; }
  #heard { font-size: 15px; color: #1E7; min-height: 20px; text-align: center; font-weight: bold; }
  #heard.bad { color: #E77; }
  .btn-row { display: flex; gap: 10px; }
  .bigbtn { flex: 1; border: none; border-radius: 16px; padding: 14px 8px; font-family: inherit;
    font-size: clamp(15px,3.4vw,20px); font-weight: bold; cursor: pointer; color: #fff;
    box-shadow: 0 5px 0 rgba(0,0,0,.25); transition: transform .07s; min-height: 60px; }
  .bigbtn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  #micBtn { background: var(--ok); }
  #micBtn.listening { background: #E33; animation: pulse .8s infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }
  #listenBtn { background: #3498DB; }
  #hintBtn { background: var(--warn); }
  #doneBtn { background: #9B59B6; }
  .sound-toggle { position: absolute; top: 8px; right: 14px; z-index: 6;
    background: rgba(0,0,0,.3); color: #fff; border: none; border-radius: 12px;
    padding: 6px 12px; font-size: 16px; cursor: pointer; }

  /* ── WIN ── */
  #winScreen { flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    text-align: center; background: linear-gradient(180deg,#FFD54A 0%,#FF9F43 100%); padding: 24px; }
  #winScreen h1 { font-size: clamp(30px,7vw,60px); color: #fff; text-shadow: 3px 3px 0 #C0392B; }
  #winScreen img { width: min(60vw,260px); }
  #winScreen p { font-size: clamp(16px,3.5vw,22px); color: #663; font-weight: bold; }
  #winScreen .again { background:#fff; color:#C0392B; border:none; border-radius:18px;
    padding:14px 28px; font-size:20px; font-weight:bold; font-family:inherit; cursor:pointer; box-shadow:0 6px 0 #C0392B; }
  .confetti { position: absolute; top: -20px; width: 12px; height: 18px; opacity: .9;
    animation: fall linear forwards; z-index: 3; pointer-events: none; }
  @keyframes fall { to { transform: translateY(105vh) rotate(720deg); } }

  /* toast */
  #toast { position: absolute; top: 42%; left: 50%; transform: translate(-50%,-50%) scale(0);
    background: var(--gold); color: #333; font-size: clamp(30px,8vw,64px); font-weight: bold;
    padding: 14px 34px; border-radius: 20px; box-shadow: 0 8px 0 #C99; z-index: 10;
    text-shadow: 2px 2px 0 #fff; transition: transform .25s cubic-bezier(.2,1.6,.4,1); pointer-events: none; }
  #toast.show { transform: translate(-50%,-50%) scale(1); }
</style>
</head>
<body>

<!-- ══ START ══ -->
<section id="startScreen" class="screen active">
  <a class="home-link" href="index.html">🏠 처음으로</a>
  <h1>🍄 무대 계단 오르기</h1>
  <p>문장을 말하면 한 칸씩 올라가요!<br>끝까지 오르면 🏆 우승!</p>
  <div class="world-btns">
    <button class="world-btn" onclick="startGame(1)">
      <span class="wnum">1</span><span class="wname">보고 말하기</span>
      <span class="wdesc">문장을 보면서 따라 말해요</span>
    </button>
    <button class="world-btn" onclick="startGame(2)">
      <span class="wnum">2</span><span class="wname">힌트만 보기</span>
      <span class="wdesc">첫 글자만 보고 기억해요</span>
    </button>
    <button class="world-btn" onclick="startGame(3)">
      <span class="wnum">3</span><span class="wname">진짜 무대</span>
      <span class="wdesc">아무것도 안 보고 발표!</span>
    </button>
  </div>
  <p style="font-size:14px;background:rgba(255,255,255,.5)">🎤 크롬(Chrome)에서 열면 목소리도 알아들어요</p>
  <p id="loadingNote" style="display:none;font-size:16px;background:rgba(255,255,255,.8);color:#124;padding:8px 16px;border-radius:14px">⏳ 무대 준비 중… 잠깐만요!</p>
</section>

<!-- ══ GAME ══ -->
<section id="gameScreen" class="screen">
  <div id="hud">
    <span class="world-tag" id="worldTag">WORLD 1</span>
    <span id="stepTag">1 / 14</span>
    <span>🪙 <span id="coinCount">0</span></span>
    <span class="spacer"></span>
    <a class="back" href="index.html">🏠</a>
  </div>
  <div id="stageWrap">
    <button class="sound-toggle" id="soundToggle" onclick="toggleBgm()">🔊</button>
    <canvas id="stageCanvas"></canvas>
    <canvas id="stage2d"></canvas>
    <div id="toast"></div>
  </div>
  <div id="panel">
    <div id="picCard"><img id="picImg" src="" alt=""></div>
    <div id="centerCol">
      <div id="sentenceBox">준비!</div>
      <div id="heard"></div>
      <div class="btn-row">
        <button class="bigbtn" id="micBtn" onclick="onMic()">🎤 말하기</button>
        <button class="bigbtn" id="listenBtn" onclick="onListen()">🔈 들려줘</button>
      </div>
      <div class="btn-row">
        <button class="bigbtn" id="hintBtn" onclick="onHint()">💡 힌트</button>
        <button class="bigbtn" id="doneBtn" onclick="onDone()">✅ 말했어요</button>
      </div>
    </div>
  </div>
</section>

<!-- ══ WIN ══ -->
<section id="winScreen" class="screen">
  <h1>🏆 우승! 🏆</h1>
  <img id="winImg" src="images/stage/hero_win.png" alt="" onerror="this.style.display='none'">
  <p id="winMsg">발표를 끝까지 해냈어요!<br>승한이 최고! 👏👏👏</p>
  <button class="again" onclick="location.reload()">🔁 다시 하기</button>
</section>

<script>
/* ══════════════════ 대본 데이터 ══════════════════ */
// img: 그림 파일. skip: 인식 매칭에서 빼는 단어(이름·의성어).
const SENTENCES = [
  { t: "Hello, everyone!",                                   img: "images/01_hello.png" },
  { t: "My name is 승한.",                                    img: "images/02_my_name.png",        skip: ["승한","seunghan","seung","han"] },
  { t: "I am six years old.",                                img: "images/03_six_years.png" },
  { t: "Today, I want to talk about my future jobs.",        img: "images/stage/04_future_jobs.png" },
  { t: "I want to be a firefighter.",                        img: "images/04_want_firefighter.png" },
  { t: "Firefighters are brave.",                            img: "images/05_brave_firefighter.png" },
  { t: "They help people and save lives. Woo-woo!",          img: "images/07_save_lives.png",      skip: ["woowoo","woo","woohoo"], siren: true },
  { t: "I also want to be a police officer.",                img: "images/09_police.png" },
  { t: "Police officers are strong and catch bad guys to keep us safe.", img: "images/10_strong.png" },
  { t: "I would also like to be a doctor.",                  img: "images/13_doctor_child.png" },
  { t: "Doctors are kind because help sick people feel better.", img: "images/14_doctors_kind.png" },
  { t: "A firefighter, police officer and doctor are what I want to be!", img: "images/stage/12_all_three.png" },
  { t: "I want to help people! That is my dream.",           img: "images/stage/13_dream.png" },
  { t: "Thank you!",                                         img: "images/stage/14_thank_you.png" },
];
const TOTAL = SENTENCES.length;

/* ══════════════════ 상태 ══════════════════ */
let world = 1;      // 1 보고 / 2 힌트 / 3 무대
let idx = 0;        // 현재 문장
let coins = 0;
let hintLevel = 0;  // 0 없음, 1 첫단어, 2 절반, 3 전체+TTS
let failCount = 0;
let busy = false;   // 애니메이션 중 입력 잠금

/* ══════════════════ 오디오 (WebAudio 합성) ══════════════════ */
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, start, dur, type='square', vol=0.2) {
  const c = ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, c.currentTime + start);
  o.connect(g); g.connect(masterGain());
  g.gain.setValueAtTime(0.0001, c.currentTime + start);
  g.gain.exponentialRampToValueAtTime(vol, c.currentTime + start + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
  o.start(c.currentTime + start); o.stop(c.currentTime + start + dur + 0.02);
}
function sweep(f0, f1, start, dur, type='square', vol=0.18) {
  const c = ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, c.currentTime + start);
  o.frequency.exponentialRampToValueAtTime(f1, c.currentTime + start + dur);
  o.connect(g); g.connect(masterGain());
  g.gain.setValueAtTime(vol, c.currentTime + start);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
  o.start(c.currentTime + start); o.stop(c.currentTime + start + dur + 0.02);
}
function noise(start, dur, vol=0.15) {
  const c = ac(); if (!c) return;
  const n = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, n, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const src = c.createBufferSource(); src.buffer = buf;
  const g = c.createGain(); g.gain.value = vol;
  src.connect(g); g.connect(masterGain());
  src.start(c.currentTime + start);
}
let _master = null;
function masterGain() {
  const c = ac(); if (!c) return null;
  if (!_master) { _master = c.createGain(); _master.gain.value = 1; _master.connect(c.destination); }
  return _master;
}

// SFX
function sfxCoin()  { tone(988,0,0.08,'square',0.22); tone(1319,0.07,0.18,'square',0.22); }
function sfxJump()  { sweep(300,760,0,0.18,'square',0.18); }
function sfxError() { tone(200,0,0.18,'triangle',0.16); }
function sfxClick() { noise(0,0.05,0.1); }
function sfxMicOn() { tone(1200,0,0.1,'sine',0.15); }
function sfxWorldClear() { [523,659,784,1047,1319].forEach((f,i)=>tone(f,i*0.1,0.28,'square',0.2)); }
function sfxWin() {
  [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*0.13,0.3,'square',0.22));
  for (let i=0;i<8;i++) noise(0.4+i*0.12, 0.14, 0.12);   // 박수/환호
  [392,523,659].forEach(f=>tone(f,0.9,0.9,'sine',0.14));  // 화음
}
// 소방차 사이렌: 두 음 사이를 길게 오르내리는 "위우~위우~" 울림.
// _siren에 노드 보관 → 다음 문장으로 넘어가면 stopSiren()으로 즉시 정지.
let _siren = null;
function stopSiren() {
  if (!_siren) return;
  const s = _siren; _siren = null;
  const c = ac();
  try {
    if (c) {                                 // 뚝 소리 방지: 40ms 페이드 후 정지
      const now = c.currentTime;
      s.g.gain.cancelScheduledValues(now);
      s.g.gain.setValueAtTime(s.g.gain.value, now);
      s.g.gain.linearRampToValueAtTime(0.0001, now + 0.04);
      s.osc.stop(now + 0.05);
      setTimeout(() => { try { s.g.disconnect(); } catch(e){} }, 100);
    } else {
      s.osc.stop(); s.g.disconnect();
    }
  } catch(e){}
}
function sfxSiren() {
  stopSiren();                       // 겹침 방지: 이전 사이렌 정지
  const c = ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = 'sawtooth';
  const filt = c.createBiquadFilter();     // 톱니파 거친 고음 완화(덜 날카롭게)
  filt.type = 'lowpass'; filt.frequency.value = 1300;
  o.connect(filt); filt.connect(g); g.connect(masterGain() || c.destination);
  const lo = 620, hi = 990, seg = 0.55, cycles = 3, peak = 0.10;
  let t = c.currentTime + 0.03;
  o.frequency.setValueAtTime(lo, t);
  g.gain.setValueAtTime(0.0001, t);
  for (let i = 0; i < cycles; i++) {        // 매 사이클: 위(hi)→아래(lo)로 오르내리며 살짝 부풀었다 줄어듦
    [hi, lo].forEach(f => {
      o.frequency.linearRampToValueAtTime(f, t + seg);
      g.gain.linearRampToValueAtTime(peak, t + seg*0.5);
      g.gain.linearRampToValueAtTime(peak*0.5, t + seg);
      t += seg;
    });
  }
  g.gain.linearRampToValueAtTime(0.0001, t + 0.15);   // 멀어지듯 사라짐
  o.start(c.currentTime + 0.03); o.stop(t + 0.2);
  _siren = { osc: o, g };
  o.onended = () => { if (_siren && _siren.osc === o) _siren = null; };
}

/* ── 배경음악 (칩튠 루프) ── */
let bgmOn = true, bgmTimer = null, bgmStep = 0, bgmPausedForMic = false;
const MELODY = [523,0,659,784, 659,0,523,587, 659,784,880,784, 659,587,523,0];
const BASS   = [131,131,165,165, 131,131,147,147, 165,165,196,196, 131,131,98,98];
function bgmTick() {
  if (bgmOn && !bgmPausedForMic) {
    const m = MELODY[bgmStep % MELODY.length];
    const b = BASS[bgmStep % BASS.length];
    if (m) tone(m, 0, 0.12, 'square', 0.06);
    if (b) tone(b, 0, 0.16, 'triangle', 0.05);
    if (bgmStep % 2 === 0) noise(0, 0.02, 0.02);  // 하이햇
  }
  bgmStep++;
}
function startBgm() { if (bgmTimer) return; bgmTimer = setInterval(bgmTick, 200); }
function toggleBgm() {
  bgmOn = !bgmOn;
  document.getElementById('soundToggle').textContent = bgmOn ? '🔊' : '🔇';
}

/* ── TTS (문장 읽어주기) ── */
let _voice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  if (!vs.length) return;
  _voice = vs.find(v => v.name === 'Samantha')
    || vs.find(v => v.lang === 'en-US' && /female|woman|zira/i.test(v.name))
    || vs.find(v => v.lang && v.lang.startsWith('en-US'))
    || vs.find(v => v.lang && v.lang.startsWith('en')) || vs[0];
}
if ('speechSynthesis' in window) { speechSynthesis.addEventListener('voiceschanged', pickVoice); pickVoice(); }
function speak(text, cb) {
  if (!('speechSynthesis' in window)) { if (cb) cb(); return; }
  try {
    speechSynthesis.cancel();
    // 한글 이름은 발음이 어색하므로 영어 스펠 대체
    const say = text.replace(/승한/g, 'Seung-han');
    const u = new SpeechSynthesisUtterance(say);
    u.lang = 'en-US'; u.rate = 0.8; u.pitch = 1.15;
    if (_voice) u.voice = _voice;
    if (cb) u.onend = cb;
    speechSynthesis.speak(u);
  } catch(e) { if (cb) cb(); }
}
// 문장 읽어주기. siren 문장은 "Woo-woo!"를 빼고 읽은 뒤 소방차 사이렌으로 대체.
// speakToken: 새로 재생/취소될 때마다 증가 → 취소된 이전 발화의 onend가
// 사이렌을 잘못 울리는 것(중복·조기 발사) 방지.
let speakToken = 0;
function speakSentence(i) {
  speakToken++;
  stopSiren();                 // 다시 누르면 이전 사이렌 정지 (새 낭독 위에 겹치지 않게)
  const s = SENTENCES[i];
  if (s.siren) {
    ac();
    const token = speakToken;
    const words = s.t.replace(/woo-?woo!?/ig, '').trim();  // 앞부분만 읽고
    speak(words, () => {                                   // 끝나면 사이렌 "위우~위우~"
      if (token === speakToken && idx === i && !busy) sfxSiren();
    });
  } else {
    speak(s.t);
  }
}

/* ══════════════════ 음성 인식 ══════════════════ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null, listening = false;
function setMicListening() {   // 듣는 중 표시 + BGM 잠시 멈춤
  listening = true; bgmPausedForMic = true;
  const b = document.getElementById('micBtn'); b.classList.add('listening'); b.textContent = '🎙️ 듣는중';
}
function setMicIdle() {        // 대기 상태 복귀
  listening = false; bgmPausedForMic = false;
  const b = document.getElementById('micBtn'); b.classList.remove('listening'); b.textContent = '🎤 말하기';
}
function stopListening() { if (listening) { try { recog.stop(); } catch(e){} } }
function initRecog() {
  if (!SR) return null;
  const r = new SR();
  r.lang = 'en-US'; r.continuous = false; r.interimResults = true; r.maxAlternatives = 3;
  r.onstart = setMicListening;
  r.onend = setMicIdle;
  r.onerror = (e) => { setMicIdle();
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') showHeard('마이크를 허용해 주세요 🎤 (또는 "말했어요" 버튼)', true); };
  r.onresult = (ev) => {
    let txt = '';
    for (let i=0;i<ev.results.length;i++) txt += ev.results[i][0].transcript + ' ';
    showHeard('🗣️ ' + txt.trim(), false);
    if (ev.results[ev.results.length-1].isFinal) checkAnswer(txt);
  };
  return r;
}
function onMic() {
  sfxClick(); ac();
  if (!SR) { showHeard('이 브라우저는 목소리 인식이 안돼요. "말했어요" 버튼을 눌러요 👇', true); return; }
  if (listening) { stopListening(); return; }
  if (!recog) recog = initRecog();
  try { recog.start(); sfxMicOn(); } catch(e) { try { recog.stop(); } catch(_){} }
}

// 입력 잠금: 정답 연출 중(busy)이거나 월드 클리어 이후(idx>=TOTAL) 버튼/인식 무시
function inputLocked() { return busy || idx >= TOTAL; }
// 진행 중인 발화 취소: 사이렌 정지 + 대기중 사이렌 콜백 무효화 + TTS 취소 (한 동작)
function cancelSpeech() { speakToken++; stopSiren(); try { speechSynthesis.cancel(); } catch(e){} }

/* ── 매칭: 60% 단어 일치 ── */
function normWords(s) {
  return s.toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim().split(' ').filter(Boolean);
}
function checkAnswer(spoken) {
  if (inputLocked()) return;   // 연출 중/종료 후 지연된 인식 결과 무시
  const cur = SENTENCES[idx];
  const skip = new Set((cur.skip || []).map(x => x.toLowerCase()));
  const target = normWords(cur.t).filter(w => !skip.has(w));
  const said = new Set(normWords(spoken));
  if (target.length === 0) { succeed(); return; }
  let hit = 0;
  target.forEach(w => { if (said.has(w)) hit++; });
  const ratio = hit / target.length;
  if (ratio >= 0.6) { succeed(); }
  else { fail(ratio); }
}
function showHeard(msg, bad) {
  const el = document.getElementById('heard');
  el.textContent = msg; el.className = bad ? 'bad' : '';
}

/* ══════════════════ 성공 / 실패 ══════════════════ */
function succeed() {
  if (busy) return;
  busy = true; failCount = 0; hintLevel = 0;
  cancelSpeech();                       // 넘어가면 사이렌·TTS 정지
  sfxCoin();
  coins++; document.getElementById('coinCount').textContent = coins;
  showHeard('잘했어요! 🎉', false);
  heroJump(() => {
    idx++;
    if (idx >= TOTAL) { winWorld(); return; }
    busy = false;
    renderStep();
  });
}
function fail(ratio) {
  sfxError();
  failCount++;
  showHeard(ratio > 0 ? `조금만 더! (${Math.round(ratio*100)}%) 다시 해볼까요? 🙂` : '다시 한 번 말해볼까요? 🙂', true);
  if (failCount >= 3) { hintLevel = Math.min(hintLevel + 1, 3); failCount = 0; applyHint(); }
}

/* ══════════════════ 힌트 ══════════════════ */
function onHint() {
  if (inputLocked()) return;   // 월드클리어 연출 중 클릭 방지
  sfxClick();
  hintLevel = Math.min(hintLevel + 1, 3);
  applyHint();
}
function applyHint() {
  renderSentence();
  if (hintLevel >= 3) speakSentence(idx);
}
function hintText() {
  const full = SENTENCES[idx].t;
  const words = full.split(' ');
  if (world === 1) return full;                       // 월드1: 항상 전체
  if (hintLevel === 0) {                               // 월드2/3 기본
    if (world === 2) return words.map((w,i)=> i===0 ? w : maskWord(w)).join(' ');
    return '＿ '.repeat(Math.min(words.length,8)).trim(); // 월드3: 완전 가림
  }
  if (hintLevel === 1) return words.map(w => w[0] + maskWord(w.slice(1))).join(' ');
  if (hintLevel === 2) {                               // 절반 공개
    const half = Math.ceil(words.length/2);
    return words.map((w,i)=> i<half ? w : maskWord(w)).join(' ');
  }
  return full;                                         // 3: 전체
}
function maskWord(w) {
  return w.replace(/[A-Za-z0-9]/g,'＿');   // 글자만 가림, 구두점은 그대로 남음
}

/* ══════════════════ 렌더 ══════════════════ */
function renderStep() {
  document.getElementById('stepTag').textContent = (idx+1) + ' / ' + TOTAL;
  document.getElementById('picImg').src = SENTENCES[idx].img;
  showHeard('', false);
  renderSentence();
  moveHeroTo(idx);
}
function renderSentence() {
  const box = document.getElementById('sentenceBox');
  const txt = hintText();
  box.innerHTML = txt.split('').map(ch => ch === '＿'
    ? '<span class="dim">＿</span>' : ch).join('');
}
function onListen() {
  if (inputLocked()) return;
  sfxClick(); ac();
  stopListening();          // 마이크가 TTS를 주워듣지 않게
  speakSentence(idx);
}
function onDone()  {
  if (inputLocked()) return;
  stopListening();          // 넘어간 뒤 지연 인식으로 다음 문장 오통과 방지
  succeed();
}   // 안전망 버튼 — 항상 통과

/* ══════════════════ 토스트 / 폭죽 ══════════════════ */
function toast(msg, ms=1100) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), ms);
}
function confettiBurst(n=60) {
  const colors = ['#FF5252','#FFD54A','#4CAF50','#2196F3','#E040FB','#FF9800'];
  for (let i=0;i<n;i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (1.6 + Math.random()*1.6) + 's';
    c.style.animationDelay = (Math.random()*0.5) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3600);
  }
}

/* ══════════════════ 월드 클리어 / 우승 ══════════════════ */
function winWorld() {
  heroWin();
  sfxWorldClear();
  toast('WORLD CLEAR!', 1600);
  confettiBurst(40);
  setTimeout(() => {
    if (world < 3) {
      // 다음 월드 자동 진행
      world++; idx = 0; hintLevel = 0; failCount = 0; busy = false;
      setWorldTag();
      buildStage();
      renderStep();
      toast('WORLD ' + world + ' 시작!', 1300);

      finishAll();
    }
  }, 2200);
}
function finishAll() {
  sfxWin();
  confettiBurst(120);
  // 자원 정리: 배경음악 정지 + 3D 렌더 루프 중단 (숨은 캔버스 GPU/배터리 낭비 방지)
  if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }

}

/* ══════════════════ 시작 ══════════════════ */
// Three.js는 네트워크로 늦게 로드됨. 로드 확정 전에 월드 버튼을 누르면
// 3D가 준비됐는데도 2D로 빠지는 경쟁 상태 → 확정될 때까지 대기 후 자동 시작.
let threeSettled = false, pendingWorld = 0;
function onThreeSettled() {
  if (threeSettled) return;
  threeSettled = true;
  if (pendingWorld) { const w = pendingWorld; pendingWorld = 0; startGame(w); }
}
// 3초 안에 CDN이 응답 없으면 2D로라도 시작 (무한 대기 방지)
setTimeout(onThreeSettled, 3000);

function startGame(w) {

    pendingWorld = w;

  }

/* ══════════════════ 3D 무대 (Three.js) + 2D 폴백 ══════════════════ */
let use3D = false;
let scene, camera, renderer, heroSprite, heroShadow, steps3d = [], flagMesh;
let clouds3d = [], coins3d = [], castleGrp = null;
let heroTex = { idle:null, jump:null, win:null };
let animRAF = null, camShakeT = 0;

function initStage() {
  if (window.THREE) { try { init3D(); use3D = true; return; } catch(e) { console.warn('3D 실패, 2D로', e); } }
  use3D = false; init2D();
}

/* ── 3D ── */
function init3D() {
  const canvas = document.getElementById('stageCanvas');
  const wrap = document.getElementById('stageWrap');
  document.getElementById('stage2d').style.display = 'none';
  canvas.style.display = 'block';
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 3));
  if ('outputEncoding' in renderer) renderer.outputEncoding = THREE.sRGBEncoding;  // 색 선명하게
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8FD3FF);
  scene.fog = new THREE.Fog(0x8FD3FF, 55, 130);   // 안개 멀리 → 또렷
  camera = new THREE.PerspectiveCamera(52, wrap.clientWidth/wrap.clientHeight, 0.1, 300);
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  scene.add(new THREE.HemisphereLight(0xBFE3FF, 0x6B8E23, 0.5));
  const dir = new THREE.DirectionalLight(0xfff4d6, 0.85);
  dir.position.set(-8, 22, 10);
  dir.castShadow = true;
  dir.shadow.mapSize.set(1024, 1024);
  const sc = dir.shadow.camera;
  sc.left = -18; sc.right = 18; sc.top = 24; sc.bottom = -8; sc.near = 1; sc.far = 60;
  scene.add(dir);
  // 태양
  const sun = new THREE.Mesh(new THREE.SphereGeometry(2.2, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xFFF3B0 }));
  sun.position.set(-14, 20, -22); scene.add(sun);
  // 구름 (덩어리 여러 개 뭉쳐 입체감)
  for (let i=0;i<8;i++) {
    const grp = new THREE.Group();
    for (let j=0;j<3;j++) {
      const cl = new THREE.Mesh(new THREE.SphereGeometry(1.2+Math.random()*0.8, 10, 10),
        new THREE.MeshLambertMaterial({ color: 0xffffff }));
      cl.position.set(j*1.4 - 1.4, Math.random()*0.5, Math.random()*0.5);
      grp.add(cl);
    }
    grp.position.set(-18+Math.random()*36, 6+i*2.2, -12-Math.random()*10);
    scene.add(grp); clouds3d.push(grp);
  }
  // 잔디 바닥
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120),
    new THREE.MeshLambertMaterial({ color: 0x7EC84B }));
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -1.2;
  ground.receiveShadow = true;
  scene.add(ground);
  // 히어로 텍스처 로드
  const loader = new THREE.TextureLoader();
  const maxAniso = renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 1;
  const loadCrisp = (url) => loader.load(url, (t) => {
    if ('encoding' in t) t.encoding = THREE.sRGBEncoding;
    t.anisotropy = maxAniso;
    t.magFilter = THREE.LinearFilter;
    t.minFilter = THREE.LinearMipmapLinearFilter;
    t.generateMipmaps = true;
    t.needsUpdate = true;
  });
  heroTex.idle = loadCrisp('images/stage/hero_idle.png');
  heroTex.jump = loadCrisp('images/stage/hero_jump.png');
  heroTex.win  = loadCrisp('images/stage/hero_win.png');
  const mat = new THREE.SpriteMaterial({ map: heroTex.idle, transparent: true });
  heroSprite = new THREE.Sprite(mat);
  heroSprite.scale.set(2.4, 2.4, 1);
  scene.add(heroSprite);
  // 히어로 발밑 그림자 (땅에 붙어보이게)
  heroShadow = new THREE.Mesh(new THREE.CircleGeometry(0.7, 20),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.28 }));
  heroShadow.rotation.x = -Math.PI/2;
  scene.add(heroShadow);
  render3DLoop();   // 매 프레임 fixCanvasSize()가 크기·화질을 맞춤 (별도 resize 핸들러 불필요)
}
const STEP_DX = 1.5, STEP_DY = 1.0, STEP_DZ = -1.1;
function stepPos(i) { return { x: i*STEP_DX - (TOTAL*STEP_DX)/2, y: i*STEP_DY, z: i*STEP_DZ }; }

function makeCoin() {
  const g = new THREE.Group();
  const face = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.09, 20),
    new THREE.MeshStandardMaterial({ color: 0xFFD54A, metalness: 0.5, roughness: 0.35,
      emissive: 0x554400, emissiveIntensity: 0.4 }));
  face.rotation.x = Math.PI/2;
  g.add(face);
  return g;
}
function makeCastle() {
  const g = new THREE.Group();
  const wall = new THREE.MeshStandardMaterial({ color: 0xD98C4A, roughness: 0.9 });
  const roof = new THREE.MeshStandardMaterial({ color: 0xC0392B, roughness: 0.8 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(3.4, 2.4, 2.4), wall);
  body.position.y = 1.2; body.castShadow = true; g.add(body);
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.3, 0.1),
    new THREE.MeshStandardMaterial({ color: 0x3A1E0A }));
  door.position.set(0, 0.65, 1.21); g.add(door);
  [-1.7, 1.7].forEach(dx => {
    const tw = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.6, 3.2, 12), wall);
    tw.position.set(dx, 1.6, 0); tw.castShadow = true; g.add(tw);
    const rf = new THREE.Mesh(new THREE.ConeGeometry(0.75, 1.1, 12), roof);
    rf.position.set(dx, 3.75, 0); g.add(rf);
  });
  const mid = new THREE.Mesh(new THREE.ConeGeometry(1.1, 1.5, 4), roof);
  mid.position.y = 3.15; mid.rotation.y = Math.PI/4; g.add(mid);
  return g;
}

function build3DStage() {
  steps3d.forEach(m => { scene.remove(m); }); steps3d = [];
  coins3d.forEach(c => scene.remove(c)); coins3d = [];
  if (flagMesh) { scene.remove(flagMesh); flagMesh = null; }
  if (castleGrp) { scene.remove(castleGrp); castleGrp = null; }
  for (let i=0;i<TOTAL;i++) {
    const p = stepPos(i);
    const box = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.0, 1.4),
      new THREE.MeshStandardMaterial({ color: 0xC8641E, roughness: 0.85 }));
    box.position.set(p.x, p.y, p.z);
    box.castShadow = true; box.receiveShadow = true;
    scene.add(box); steps3d.push(box);
    // 각 계단 위 금화 (통과하면 사라짐)
    const coin = makeCoin();
    coin.position.set(p.x, p.y + 1.2, p.z);
    scene.add(coin); coins3d.push(coin);
  }
  // 정상 성 + 깃대
  const top = stepPos(TOTAL-1);
  castleGrp = makeCastle();
  castleGrp.position.set(top.x + 2.6, top.y + 0.5, top.z - 0.5);
  scene.add(castleGrp);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,4.5,8),
    new THREE.MeshStandardMaterial({ color: 0x2E7D32 }));
  pole.position.set(top.x+1.1, top.y+2.2, top.z);
  pole.castShadow = true;
  scene.add(pole); steps3d.push(pole);
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(1.1,0.75),
    new THREE.MeshBasicMaterial({ color: 0xFF5252, side: THREE.DoubleSide }));
  flag.position.set(top.x+1.7, top.y+3.9, top.z);
  scene.add(flag); flagMesh = flag; steps3d.push(flag);
  placeHero3D(0);
  markDone3D();
}
function markDone3D() {
  for (let i=0;i<TOTAL && i<steps3d.length;i++) {
    if (steps3d[i].geometry && steps3d[i].geometry.type === 'BoxGeometry')
      steps3d[i].material.color.setHex(i < idx ? 0xFFD54A : 0xC8641E);
  }
  // 밟은 계단의 금화 숨김
  for (let i=0;i<coins3d.length;i++) coins3d[i].visible = (i >= idx);
}
function placeHero3D(i) {
  const p = stepPos(i);
  heroSprite.position.set(p.x, p.y + 1.7, p.z + 0.9);
  if (heroShadow) { heroShadow.position.set(p.x, p.y + 0.52, p.z + 0.4); heroShadow.scale.setScalar(1); }
  camFollow(i);
}
function camFollow(i) {
  const p = stepPos(i);
  camera.position.set(p.x - 5, p.y + 3.6, p.z + 7.5);
  camera.lookAt(p.x + 0.5, p.y + 1.2, p.z);
}
function fixCanvasSize() {
  const c = renderer.domElement;
  const pr = Math.min(devicePixelRatio, 3);
  const w = Math.floor(c.clientWidth * pr), h = Math.floor(c.clientHeight * pr);  // three.setSize도 floor 사용 → 매프레임 재할당 방지
  if (c.clientWidth > 0 && (c.width !== w || c.height !== h)) {
    renderer.setSize(c.clientWidth, c.clientHeight, false);
    camera.aspect = c.clientWidth / c.clientHeight;
    camera.updateProjectionMatrix();
  }
}
function render3DLoop() {
  animRAF = requestAnimationFrame(render3DLoop);
  fixCanvasSize();   // 매 프레임 표시 크기와 렌더 해상도 일치 → 흐림 방지
  const t = (camShakeT += 0.016);
  if (flagMesh) flagMesh.rotation.y += 0.03;
  coins3d.forEach(c => { if (c.visible) c.rotation.y += 0.06; });
  clouds3d.forEach((cl,i) => { cl.position.x += 0.004 * (i%2?1:-1); });
  // 히어로 살짝 둥실 + 카메라 미세 흔들림 (생동감)
  if (heroSprite) heroSprite.position.y += Math.sin(t*2) * 0.004;
  if (camera) { camera.position.y += Math.sin(t*1.3) * 0.004; }
  renderer.render(scene, camera);
}

/* ── 2D 폴백 ── */
let ctx2d, cw, ch;
function init2D() {   // initStage()가 호출 전 use3D=false 설정함
  document.getElementById('stageCanvas').style.display = 'none';
  const cv = document.getElementById('stage2d');
  cv.style.display = 'block';
  ctx2d = cv.getContext('2d');
  fit2D();
  window.addEventListener('resize', () => { fit2D(); draw2D(); });
  img2d.idle.src = 'images/stage/hero_idle.png';
  img2d.jump.src = 'images/stage/hero_jump.png';
  img2d.win.src  = 'images/stage/hero_win.png';
  requestAnimationFrame(loop2D);
}
const img2d = { idle:new Image(), jump:new Image(), win:new Image() };
let hero2dState = 'idle', hero2dY = 0;
function fit2D() {
  const cv = document.getElementById('stage2d');
  const wrap = document.getElementById('stageWrap');
  cw = cv.width = wrap.clientWidth; ch = cv.height = wrap.clientHeight;
}
function loop2D() { if (!use3D) { draw2D(); requestAnimationFrame(loop2D); } }
function draw2D() {
  if (!ctx2d) return;
  ctx2d.clearRect(0,0,cw,ch);
  // 하늘
  const g = ctx2d.createLinearGradient(0,0,0,ch);
  g.addColorStop(0,'#5CB3FF'); g.addColorStop(1,'#B6E3A8');
  ctx2d.fillStyle = g; ctx2d.fillRect(0,0,cw,ch);
  // 계단 (아래→위, 오른쪽으로)
  const n = TOTAL, sw = cw/(n+2), baseY = ch-30;
  for (let i=0;i<n;i++) {
    const x = sw*(i+1), h = (i+1)*(ch-90)/n, y = baseY - h;
    ctx2d.fillStyle = i < idx ? '#FFD54A' : '#C8641E';
    ctx2d.fillRect(x, y, sw*0.92, ch - y);
    ctx2d.strokeStyle = '#7A3B10'; ctx2d.lineWidth = 2;
    ctx2d.strokeRect(x, y, sw*0.92, ch - y);
  }
  // 깃발
  const fx = sw*(n)+sw*0.4, fh = n*(ch-90)/n;
  ctx2d.fillStyle = '#2E7D32'; ctx2d.fillRect(fx, baseY-fh-70, 5, 70);
  ctx2d.fillStyle = '#FF5252'; ctx2d.fillRect(fx+5, baseY-fh-70, 28, 18);
  // 히어로
  const hi = Math.min(idx, n-1);
  const hx = sw*(hi+1), hy = baseY - (hi+1)*(ch-90)/n;
  const im = img2d[hero2dState];
  if (im && im.complete && im.naturalWidth) {
    const size = sw*1.4;
    ctx2d.drawImage(im, hx - size*0.2, hy - size - hero2dY, size, size);
  } else {
    ctx2d.font = (sw)+'px serif'; ctx2d.fillText('🦸', hx, hy - hero2dY);
  }
}

/* ── 무대 빌드 (3D/2D 공통 진입) ── */
function buildStage() {
  if (use3D) build3DStage();
  else { hero2dState = 'idle'; }
}
function moveHeroTo(i) {
  if (use3D) { placeHero3D(i); markDone3D(); if (heroSprite) heroSprite.material.map = heroTex.idle; }
  else { hero2dState = 'idle'; }
}

/* ── 히어로 애니메이션 ── */
function heroJump(done) {
  sfxJump();
  if (use3D && heroSprite) {
    heroSprite.material.map = heroTex.jump;
    const from = idx, to = Math.min(idx+1, TOTAL-1);
    const p0 = stepPos(from), p1 = stepPos(to);
    let t = 0;
    const iv = setInterval(() => {
      t += 0.08;
      const e = Math.min(t, 1);
      const arc = Math.sin(e * Math.PI) * 1.2;
      const hx = p0.x + (p1.x-p0.x)*e, hz = p0.z + (p1.z-p0.z)*e;
      heroSprite.position.set(hx, p0.y + (p1.y-p0.y)*e + 1.7 + arc, hz + 0.9);
      if (heroShadow) {
        heroShadow.position.set(hx, p0.y + (p1.y-p0.y)*e + 0.52, hz + 0.4);
        heroShadow.scale.setScalar(1 - arc*0.4);   // 점프 높을수록 그림자 작게
      }
      camFollow(from + (to-from)*e);
      if (e >= 1) { clearInterval(iv); heroSprite.material.map = heroTex.idle; markDone3D(); done(); }
    }, 24);
  } else {
    hero2dState = 'jump';
    let t = 0;
    const iv = setInterval(() => {
      t += 0.1; hero2dY = Math.sin(Math.min(t,1)*Math.PI) * 40;
      if (t >= 1) { clearInterval(iv); hero2dY = 0; hero2dState = 'idle'; done(); }
    }, 24);
  }
}
function heroWin() {
  if (use3D && heroSprite) heroSprite.material.map = heroTex.win;
  else hero2dState = 'win';
}

/* ── 테스트 훅 (검증용) ── */
window.__testSay = function(text) { checkAnswer(text); };
window.__state = () => ({ world, idx, coins, use3D });
</script>
