<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🦸 영웅 퀴즈</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    height: 100vh; height: 100dvh;
    background: linear-gradient(160deg, #1A1A4E 0%, #0D0D1A 100%);
    font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
    display: flex; flex-direction: column;
    overflow: hidden; touch-action: manipulation;
    color: #fff;
  }

  #header {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px; background: rgba(255,255,255,0.07);
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  #header a { font-size: 13px; color: #aaa; text-decoration: none;
    border: 1px solid #555; border-radius: 12px; padding: 3px 10px; }
  #score-disp { font-size: 16px; font-weight: 900; color: #FFD700; }
  #round-disp { font-size: 13px; color: #888; }

  #progress-wrap {
    flex-shrink: 0; height: 6px; background: rgba(255,255,255,0.1);
  }
  #progress-fill { height: 100%; background: linear-gradient(90deg, #FFD700, #FF8C00);
    transition: width 0.4s ease; }

  #main { flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: space-around; padding: 12px 16px; min-height: 0; }

  #question-box {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    flex-shrink: 0;
  }
  #q-img {
    width: clamp(130px, 40vw, 190px);
    height: clamp(130px, 40vw, 190px);
    border-radius: 22px;
    object-fit: cover;
    box-shadow: 0 8px 28px rgba(0,0,0,0.35);
    animation: bounceIn 0.4s ease;
    display: block;
  }
  @keyframes bounceIn {
    0%   { transform: scale(0.4) rotate(-10deg); opacity: 0.3; }
    60%  { transform: scale(1.15) rotate(4deg); }
    80%  { transform: scale(0.95) rotate(-2deg); }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  #q-hint { font-size: 17px; color: #888; }

  #choices {
    width: 100%; max-width: 380px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    flex-shrink: 0;
  }
  .choice-btn {
    padding: 20px 10px; font-size: 22px; font-weight: 900;
    border: none; border-radius: 16px; cursor: pointer;
    touch-action: manipulation; transition: transform 0.1s;
    background: rgba(255,255,255,0.1); color: #fff;
    border: 2px solid rgba(255,255,255,0.15);
    word-break: keep-all; overflow-wrap: break-word; line-height: 1.3;
  }
  .choice-btn:active { transform: scale(0.93); }
  .choice-btn.correct { background: #43A047; border-color: #66BB6A; animation: correctPop 0.4s ease; }
  .choice-btn.wrong   { background: #D32F2F; border-color: #EF5350; animation: wrongShake 0.35s ease; }
  .choice-btn.reveal  { background: rgba(255,215,0,0.2); border-color: #FFD700; }
  .choice-btn.disabled { pointer-events: none; }

  @keyframes correctPop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
  @keyframes wrongShake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  #feedback {
    font-size: 24px; font-weight: 900; min-height: 36px; text-align: center;
    transition: opacity 0.2s;
  }
  #feedback.correct { color: #69F0AE; }
  #feedback.wrong   { color: #FF5252; }

  /* Overlay */
  #overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.85); flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px; z-index: 100; text-align: center; padding: 24px;
  }
  #overlay.show { display: flex; }
  #ov-emoji { font-size: 80px; }
  #ov-msg   { font-size: 26px; font-weight: 900; color: #FFD700; line-height: 1.5; }
  #ov-sub   { font-size: 15px; color: #FFE0B2; }
  .ov-btn   { padding: 14px 36px; font-size: 18px; font-weight: 900; border: none;
    border-radius: 30px; cursor: pointer; touch-action: manipulation; }
  #ov-next  { background: #FF6B6B; color: #fff; }
  #ov-home  { background: rgba(255,255,255,0.12); color: #ccc;
    border: 1px solid rgba(255,255,255,0.2); font-size: 14px; padding: 10px 24px; }

  /* Stars */
  .star { position: fixed; pointer-events: none; font-size: 24px;
    animation: starFly 1s ease forwards; z-index: 200; }
  @keyframes starFly {
    0%   { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-120px) scale(0.3); opacity: 0; }
  }
</style>
</head>
<body>

<div id="header">
  <a href="index.html">← 홈</a>
  <span id="score-disp">⭐ 0점</span>
  <span id="round-disp">1 / 12</span>
</div>
<div id="progress-wrap"><div id="progress-fill" style="width:0%"></div></div>

<div id="main">
  <div id="question-box">
    <img id="q-img" src="" alt="">
    <div id="q-hint">이 그림의 영어 단어는?</div>
  </div>

  <div id="choices">
    <button class="choice-btn" id="c0" onclick="onChoice(0)"></button>
    <button class="choice-btn" id="c1" onclick="onChoice(1)"></button>
    <button class="choice-btn" id="c2" onclick="onChoice(2)"></button>
    <button class="choice-btn" id="c3" onclick="onChoice(3)"></button>
  </div>

  <div id="feedback"></div>
</div>

<div id="overlay">
  <div id="ov-emoji">🏆</div>
  <div id="ov-msg"></div>
  <div id="ov-sub"></div>
  <button class="ov-btn" id="ov-next" onclick="nextQ()">다음 ▶</button>
  <button class="ov-btn" id="ov-home" onclick="location.href='index.html'">← 홈으로</button>
</div>

<script>
const WORDS = [
  { word: 'firefighter',   cat: 'fire',    emoji: '🚒', img: '08_woo_woo' },
  { word: 'police officer',cat: 'police',  emoji: '👮', img: '09_police' },
  { word: 'doctor',        cat: 'doctor',  emoji: '👨‍⚕️', img: '13_doctor_child' },
  { word: 'brave',         cat: 'fire',    emoji: '💪', img: '05_brave_firefighter' },
  { word: 'strong',        cat: 'police',  emoji: '🦾', img: '10_strong' },
  { word: 'kind',          cat: 'doctor',  emoji: '🤗', img: '14_doctors_kind' },
  { word: 'dream',         cat: 'general', emoji: '💭', img: '18_dream' },
  { word: 'hero',          cat: 'general', emoji: '🦸', img: '17_help_wide' },
  { word: 'help',          cat: 'fire',    emoji: '🤝', img: '06_help_people' },
  { word: 'save',          cat: 'fire',    emoji: '⛑️', img: '07_save_lives' },
  { word: 'safe',          cat: 'police',  emoji: '🔒', img: '12_keep_safe' },
  { word: 'thank you',     cat: 'general', emoji: '🙏', img: '19_thank_you' },
];

let score = 0, qIdx = 0, order = [], answerIdx = -1, answered = false;
let nextTO = null;

// ── Audio ──────────────────────────────────────────────────────────────
let _ac = null;
function getAC() {
  if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
  if (_ac.state === 'suspended') _ac.resume();
  return _ac;
}
function snd(type) {
  try {
    const ctx = getAC(), t = ctx.currentTime;
    if (type === 'correct') {
      [880, 659, 784].forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sine'; o.frequency.value = f;
        const s = t + i * 0.13;
        g.gain.setValueAtTime(0.35, s); g.gain.exponentialRampToValueAtTime(0.001, s + 0.38);
        o.start(s); o.stop(s + 0.4);
      });
    } else if (type === 'wrong') {
      [[300,0,0.14],[220,0.17,0.14]].forEach(([f,s,d]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'square'; o.frequency.value = f;
        const st = t + s;
        g.gain.setValueAtTime(0.25, st); g.gain.exponentialRampToValueAtTime(0.001, st+d);
        o.start(st); o.stop(st+d+0.01);
      });
    } else if (type === 'win') {
      [523,659,784,1047,1319].forEach((f,i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination); o.type='sine'; o.frequency.value=f;
        const s = t+i*0.1;
        g.gain.setValueAtTime(0.22,s); g.gain.exponentialRampToValueAtTime(0.001,s+0.3);
        o.start(s); o.stop(s+0.32);
      });
    }
  } catch(e) {}
}

function _unlockAudio() {
  try {
    const ctx = getAC();
    const buf = ctx.createBuffer(1,1,ctx.sampleRate);
    const src = ctx.createBufferSource();
    src.buffer = buf; src.connect(ctx.destination); src.start(0);
    ctx.resume();
    if (window.speechSynthesis) { const u = new SpeechSynthesisUtterance(''); speechSynthesis.speak(u); speechSynthesis.cancel(); }
    document.removeEventListener('touchstart', _unlockAudio);
    document.removeEventListener('touchend',   _unlockAudio);
    document.removeEventListener('click',      _unlockAudio);
  } catch(e) {}
}
document.addEventListener('touchstart', _unlockAudio, { passive: true });
document.addEventListener('touchend',   _unlockAudio, { passive: true });
document.addEventListener('click',      _unlockAudio);

// ── TTS ───────────────────────────────────────────────────────────────
if (window.speechSynthesis) speechSynthesis.getVoices();
function speak(word) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US'; u.rate = 0.75; u.pitch = 1.2;
  const vs = speechSynthesis.getVoices();
  const best = vs.find(v => v.name === 'Samantha') || vs.find(v => v.lang === 'en-US' && v.localService);
  if (best) u.voice = best;
  speechSynthesis.speak(u);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function spawnStars(n = 4) {
  const E = ['⭐','✨','🌟','💫','🎉'];
  for (let i = 0; i < n; i++) {
    setTimeout(() => {
      const s = document.createElement('div');
      s.className = 'star';
      s.textContent = E[Math.floor(Math.random()*E.length)];
      s.style.left = Math.random()*90+5+'vw';
      s.style.top  = Math.random()*60+20+'vh';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1100);
    }, i*90);
  }
}

// ── Game ───────────────────────────────────────────────────────────────
function startGame() {
  score = 0; qIdx = 0;
  order = shuffle([...WORDS]);
  document.getElementById('score-disp').textContent = '⭐ 0점';
  document.getElementById('overlay').classList.remove('show');
  showQuestion();
}

function showQuestion() {
  answered = false;
  if (nextTO) { clearTimeout(nextTO); nextTO = null; }
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = '';

  const target = order[qIdx];
  // Pick distractors from different categories first to avoid visual confusion
  const diffCat = shuffle(WORDS.filter(w => w.word !== target.word && w.cat !== target.cat));
  const sameCat = shuffle(WORDS.filter(w => w.word !== target.word && w.cat === target.cat));
  const others  = [...diffCat, ...sameCat].slice(0, 3);
  const options = shuffle([target, ...others]);
  answerIdx = options.findIndex(o => o.word === target.word);

  // Update progress
  const pct = (qIdx / WORDS.length) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('round-disp').textContent = `${qIdx+1} / ${WORDS.length}`;

  // Question image — reset animation
  const qImg = document.getElementById('q-img');
  qImg.style.animation = 'none';
  void qImg.offsetWidth;
  qImg.style.animation = '';
  qImg.src = `images/${target.img}.png`;
  qImg.alt = target.word;

  // Buttons
  options.forEach((item, i) => {
    const btn = document.getElementById(`c${i}`);
    btn.textContent = item.word;
    btn.className = 'choice-btn';
    btn.dataset.idx = i;
  });

  // Speak after short delay
  setTimeout(() => speak(target.word), 500);
}

function onChoice(i) {
  if (answered) return;
  answered = true;
  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach(b => b.classList.add('disabled'));

  const target = order[qIdx];
  if (i === answerIdx) {
    // Correct
    btns[i].classList.add('correct');
    snd('correct');
    speak(target.word);
    score++;
    document.getElementById('score-disp').textContent = `⭐ ${score}점`;
    document.getElementById('feedback').textContent = '정답! 🎉';
    document.getElementById('feedback').className = 'correct';
    spawnStars(4);
  } else {
    // Wrong
    btns[i].classList.add('wrong');
    btns[answerIdx].classList.add('reveal');
    snd('wrong');
    document.getElementById('feedback').textContent = `아쉬워요! → ${target.word}`;
    document.getElementById('feedback').className = 'wrong';
  }

  qIdx++;
  const isLast = qIdx >= WORDS.length;
  nextTO = setTimeout(() => {
    if (isLast) showFinal();
    else showQuestion();
  }, 1400);
}

function nextQ() {
  // used from overlay
  startGame();
}

function showFinal() {
  const pct = Math.round(score/WORDS.length*100);
  const praise = score===WORDS.length?'완벽해요! 🏆':score>=9?'정말 잘했어요! 🌟':score>=6?'잘했어요! 👍':'다시 해볼까요! 💪';
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('ov-emoji').textContent = score===WORDS.length?'🎊':'🦸';
  document.getElementById('ov-msg').textContent   = `${score} / ${WORDS.length}점\n${praise}`;
  document.getElementById('ov-sub').textContent   = `정답률 ${pct}%`;
  const btn = document.getElementById('ov-next');
  btn.textContent = '다시 하기 🔄';
  btn.onclick = () => startGame();
  if (score === WORDS.length) snd('win');
  document.getElementById('overlay').classList.add('show');
}

window.addEventListener('load', startGame);
</script>
</body>
</html>
